server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing - unknown paths must still
    # serve index.html so the router (not nginx) decides what to render
    location / {
        try_files $uri /index.html;
        # nginx's default static-file handling sends Last-Modified/ETag with
        # no Cache-Control at all - browsers apply their own heuristic
        # caching to that (RFC 7234), so a plain refresh could keep re-using
        # yesterday's index.html (and therefore yesterday's already-deployed
        # JS bundle, referenced by hashed filename inside it) without any
        # network request, while a hard refresh bypassed the cache and
        # always got the current deploy - this is what looked like a
        # deployed fix "not being there yet" on a normal reload. /static/*
        # below is unaffected and should stay aggressively cached - its
        # filenames are content-hashed, so a stale cached reference to one
        # is never actually wrong, unlike this file's own content.
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
