server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing - unknown paths must still
    # serve index.html so the router (not nginx) decides what to render
    location / {
        try_files $uri /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
