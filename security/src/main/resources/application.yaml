server:
  port: 8081

# Optional commented out H2 configuration
spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: yaron
    driverClassName: org.h2.Driver
  jpa:
    spring.jpa.database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true # required for @FeignClient(fallback = ...) to actually be used
  # "Forgot password" reset emails via Gmail SMTP - see MailService. host is
  # a fixed value (not a secret); only username/password are placeholder-
  # gated the same way google.client-id/green-api.* already are below.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS:PASTE_YOUR_GMAIL_ADDRESS_HERE}
    password: ${GMAIL_APP_PASSWORD:PASTE_YOUR_GMAIL_APP_PASSWORD_HERE}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Spring Cloud Circuitbreaker's Resilience4j default TimeLimiter is 1 second -
# fine for a single call, but the CSV bulk import can fire off a couple dozen
# sequential ItemsClient calls (existence check + create per row) in one
# request; a normal DB round-trip that's briefly a bit slower than usual
# (e.g. under that burst) trips the 1s limit, and the call falls back
# silently ("Fallback cold not create") even though nothing is actually
# broken - that's what caused rows 7/12 to fail on a 20-row import while
# everything around them succeeded. Raised well above anything a single
# create/lookup should realistically take.
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

# Was previously nested under spring: (spring.external-api...) - a property
# namespace that isn't actually spring's, so it never resolved and the
# @FeignClient annotation had its URL hardcoded instead. Now it's the real
# source of truth: override via EXTERNAL_API_ITEMS_URL for Docker, where the
# items service is reachable at its container hostname, not localhost.
external-api:
  items:
    name: "items"
    url: "${EXTERNAL_API_ITEMS_URL:http://localhost:8080/api/items}"
# Must match jwt.secret in the items/products service (8080) - it validates
# tokens issued here. No default on purpose: this used to fall back to a
# hardcoded, publicly-committed value whenever JWT_SECRET was unset, which
# would have let anyone who read the repo forge an ADMIN token accepted by
# both services. Missing the env var now fails startup instead of silently
# degrading - set JWT_SECRET (docker-compose reads it from .env; for a bare
# `mvnw spring-boot:run` export it in your shell first).
jwt:
  secret: ${JWT_SECRET}
  expiration:  36000000 # Example: 10 hours in milliseconds
#  expiration: 20000 # Example: 20 seconds

google:
  client-id: ${GOOGLE_CLIENT_ID:PASTE_YOUR_GOOGLE_CLIENT_ID_HERE}

# Product image storage - replaces Cloudinary. No credentials here on
# purpose: S3Client uses the default AWS credential chain (the EC2
# instance's IAM role in production, the local AWS CLI profile for local
# dev) - see S3Service. Bucket name/region aren't secrets, safe as plain
# defaults.
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:keren-diamonds-product-images}
    region: ${AWS_S3_REGION:eu-central-1}

# WhatsApp new-order notifications to Keren, via GreenAPI (green-api.com).
# Placeholders until Yaron sets up the account - see .env.example for how to
# get id-instance/api-token-instance and the phone number format needed.
green-api:
  id-instance: ${GREEN_API_ID_INSTANCE:PASTE_YOUR_GREEN_API_ID_INSTANCE_HERE}
  api-token-instance: ${GREEN_API_TOKEN_INSTANCE:PASTE_YOUR_GREEN_API_TOKEN_HERE}
  keren-phone: ${KEREN_WHATSAPP_NUMBER:PASTE_KEREN_PHONE_HERE}

# How long a "forgot password" email link stays valid - see
# PasswordResetService. Long enough to receive/open the email (possibly on
# another device), short enough to bound exposure if it's later compromised.
password-reset:
  token-expiry-minutes: 30



