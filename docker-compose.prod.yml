# Production override - replaces each service's local `build:` with a
# pre-built image pulled from GHCR (built by GitHub Actions on every push to
# main). Used as: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Why: the EC2 instance is a t3.micro (1GB RAM) - building 2 Maven projects
# and an npm project at once would be slow at best, OOM at worst. Building
# happens in GitHub Actions instead, where resources are plentiful.
name: karen-project

services:
  # The three app services below already lose their host port publish in
  # prod - this one was missing the same override, so the base file's
  # "5433:5432" stayed live on the internet with only an EC2 Security Group
  # rule (outside this repo) standing between it and anyone who finds it.
  postgres:
    ports: !reset []

  # Product catalog cache - internal-only, no legitimate reason for it to
  # ever be reachable from outside the compose network, same reasoning as
  # postgres above.
  redis:
    ports: !reset []

  items-service:
    image: ghcr.io/yaronhrone/karen-project-items-service:latest
    build: !reset null
    # No longer reachable directly from the internet - only the proxy
    # service is, and it reaches this over the internal compose network by
    # service name, same as always.
    ports: !reset []

  users-service:
    image: ghcr.io/yaronhrone/karen-project-users-service:latest
    build: !reset null
    ports: !reset []

  frontend:
    image: ghcr.io/yaronhrone/karen-project-frontend:latest
    build: !reset null
    ports: !reset []

  # Single public entry point (80/443) for the whole app - HTTPS via
  # Let's Encrypt is automatic (cert request + renewal), no certbot/cron to
  # maintain. Routes by path to the three internal services per the
  # Caddyfile; everything not matched falls through to the frontend.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - items-service
      - users-service

volumes:
  caddy_data:
  caddy_config:
