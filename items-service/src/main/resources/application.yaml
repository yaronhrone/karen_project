server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true

# Must match jwt.secret in the users/security service (8081) - both services
# validate tokens issued by that service. No default on purpose: this used to
# fall back to a hardcoded, publicly-committed value whenever JWT_SECRET was
# unset, which would have let anyone who read the repo forge an ADMIN token
# accepted by both services. Missing the env var now fails startup instead of
# silently degrading - set JWT_SECRET (docker-compose reads it from .env; for
# a bare `mvnw spring-boot:run` export it in your shell first).
jwt:
  secret: ${JWT_SECRET}