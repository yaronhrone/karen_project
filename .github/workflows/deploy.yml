name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: security
            image: karen-project-users-service
          - service: items-service
            image: karen-project-items-service
          - service: frontend
            image: karen-project-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-args only matter for the frontend build - Docker silently
      # ignores args a Dockerfile doesn't declare, so passing them to the two
      # Java services here is harmless.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/yaronhrone/${{ matrix.image }}:latest
          build-args: |
            REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
            REACT_APP_ITEMS_API_URL=${{ secrets.REACT_APP_ITEMS_API_URL }}
            REACT_APP_USERS_API_URL=${{ secrets.REACT_APP_USERS_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/app
            git pull origin main
            # These packages already pull without auth since the repo is public - login is a
            # nice-to-have (keeps working if that ever changes), not a hard requirement, so a
            # login failure (e.g. an expired/misscoped GHCR_PAT) doesn't block the actual deploy.
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u yaronhrone --password-stdin || echo "GHCR login failed - continuing, packages are public"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            # `up -d` only touches containers whose compose SERVICE DEFINITION
            # changed - proxy's never does (it's the same image/config every
            # deploy), so a Caddyfile-only edit was silently never picked up:
            # Caddy reads its config once at process start and never reloads,
            # and proxy just kept running un-restarted with yesterday's file
            # in memory even though the bind-mounted file on disk was already
            # current. Restart it unconditionally so a config-only change
            # can't silently fail to deploy again.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml restart proxy
            docker image prune -f
